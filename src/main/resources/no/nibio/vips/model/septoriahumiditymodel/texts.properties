name=Septoria Humitidy Model
usage=TODO\t
description=<p><strong>THE PEST:</strong>\u00a0Leaf blotch diseases of wheat can be caused by septoria tritici blotch (<em>Zymoseptoria tritici</em>) and staganospora nodorum blotch (<em>Parastagonospora nodorum</em>), which are both favoured by wet conditions.\u00a0<strong>THE DECISION:</strong>\u00a0Fungicide treatments may need to be applied between stem extension and ear emergence, mainly to protect the upper leaves.<br /><strong>THE MODEL:</strong>\u00a0Weather data from GS 31 are used. The humidity model estimates risk of septoria tritici blotch infections in winter wheat. Risk of attack is assumed after 20 hours with continuous wetness. A wet hour is defined as minimum 0,2 mm precipitation in an hour or minimum 85% relative humidity.\u00a0<strong>THE PARAMETERS:</strong>\u00a0Dates of key growth stages are given as default values, but these may not be correct for your location. To obtain accurate risk predictions it is essential to click on the 'Edit parameters' button, enter the estimated dates of GS31 (first node detectable), GS32 (second node; third upper leaf emerging), GS33 (third node; second upper leaf emerging), GS37/39 (uppermost flag leaf emerging) and GS75 (grain content milky). These estimated dates can be updated during the season as growth stages are reached. Adding information on septoria fungicide spray dates is vital for the model. After spraying, the model assumes that the crop is protected for 10 days.<br /><strong>SOURCE:</strong>\u00a0Created by Aahus University and SEGES and released in Denmark in 2017. Tested in Lithuania, Norway, Sweden, Finland and Denmark in 2018 and 2019.\u00a0<strong>ASSUMPTIONS:</strong>\u00a0septoria tritici blotch is present in the crop and periods with high humidity create risk for a damaging epidemic</p>\n<h3>Crop</h3>\n<p>Winter Wheat, wheat</p>\n<h3>Pest</h3>\n<p>Septoria leaf blotch, Glume blotch, Tan spot</p>\n<h3>Author</h3>\n<p>Lise N. J\u00f8rgensen (Aarhus University)</p>

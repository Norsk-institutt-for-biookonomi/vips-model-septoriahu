name=Bladflekker i hvete - fuktmodell
usage=TODO
description=<h2>Modellbeskrivelse</h2>\n<p>Skadegj\u00f8rer(e): hveteaksprikk, hvetebladprikk og hvetebrunflekk + (<em>Parastagonospora nodorum, Zymoseptoria tritici, Pyrenophora tritici-repentis</em>)</p>\n<p>{{filename="/images/image_01.jpg" description="Typiske symptomer av bladflekksjukdommer i hvete og hveteaksprikk i felt."}}<br /><em>Typiske symptomer av bladflekksjukdommer i hvete og hveteaksprikk i felt.</em></p>\n<h3>Modellbeskrivelse</h3>\n<p>Fuktmodellen er et beslutningsst\u00f8tteverkt\u00f8y, utviklet av <a href="https://www.seges.dk/">SEGES</a>, DK for \u00e5 kunne vurdere risiko for angrep av hvetebladprikk i h\u00f8sthvete under danske forhold. Modellen er basert p\u00e5 antall timer med bladfuktighet. Bladfuktighet er definert som nedb\u00f8r (0,2 mm) eller 85 % luftfuktighet i minst 30 min/time m\u00e5lt fra den n\u00e6rmeste v\u00e6rstasjonen.</p>\n<p>F\u00f8r modellen kan kj\u00f8res, er det viktig \u00e5 legge inn n\u00e6rmeste m\u00e5lestasjon for \u00e5 kunne innhente v\u00e6rdata fra de siste 3 dagene og prognosen for de neste 3 dagene fremover. I tillegg legges det inn dato for n\u00e5r utviklingsstadium BBCH 31 eller 32 inntreffer. Modellen beregner forventet dato for de andre utviklingsstadiene, som kan justeres manuelt ved avvik.</p>\n<p>Det er ogs\u00e5 viktig \u00e5 legge inn data for evt. gjennomf\u00f8rte spr\u00f8ytinger. Etter spr\u00f8yting med fungicider som er effektive mot bladflekksjukdommer (*) g\u00e5r modellen ut fra at plantene er beskyttet i en periode p\u00e5 10 dager.</p>\n<p>Antall timer med bladfuktighet som utl\u00f8ser et varsel og prosent luftfuktighet som definerer en fuktig time kan justeres manuelt pga. aktuelle informasjon fra det aktuelle feltet for eksempel sortsresistens, sjukdomspress i \u00e5keren, forgr\u00f8de (kryss av \u00abVis avanserte innstillinger\u00bb).</p>\n<p>(*) Aviator Xpro, Siltra Xpro, Delaro, Elatus Era, Proline eller blandinger med disse midlene (se ogs\u00e5 <a href="https://www.plantevernguiden.no/" target="_blank" rel="noopener">Plantevernguiden</a>)</p>\n<h3>Tolking av varsel</h3>\n<p>N\u00e5r antall timer med bladfuktighet i en mottakelig sort n\u00e6rmer seg 20, vil risikokurven g\u00e5r over i et r\u00f8dt omr\u00e5de og direkte bekjempingstiltak skal vurderes pga. av \u00f8kt infeksjonsrisiko. Det vises ogs\u00e5 en prognose for de kommende dager.</p>\n<p>\u00a0</p>\n<p>{{filename="/images/image_02.jpg" description="Fig. 1a Eksempel p\u00e5 h\u00f8yt antall varsler (i r\u00f8dt) for \u00c5s, v\u00e5rhvete i 2017, gjennom hele sesongen uten spr\u00f8yting."}}<br /><em>Fig. 1a Eksempel p\u00e5 h\u00f8yt antall varsler (i r\u00f8dt) for \u00c5s, v\u00e5rhvete i 2017, gjennom hele sesongen uten spr\u00f8yting.</em></p>\n<p>\u00a0{{filename="/images/image_03.jpg" description="Fig. 1b Eksempel p\u00e5 lav risiko, ingen varsel for \u00c5s, v\u00e5rhvete i 2018, gjennom hele sesongen uten spr\u00f8yting."}}<br /><em>Fig. 1b Eksempel p\u00e5 lav risiko, ingen varsel for \u00c5s, v\u00e5rhvete i 2018, gjennom hele sesongen uten spr\u00f8yting.</em></p>\n<h3>Varslingssesong \u2013 oppstart og avslutning av varsel</h3>\n<p>Modellen begynner \u00e5 oppsummere antall fuktige timer ved utviklingsstadium BBCH 32.</p>\n<h3>Utpr\u00f8ving og validering av modellen</h3>\n<h4>Nasjonalt</h4>\n<p>Vi har gjennomf\u00f8rt 8 feltfors\u00f8k hos NLR i 2018 og 2019 med spr\u00f8yting etter fuktmodellen i (Ficke et al. 2020)</p>\n<h4>Internasjonalt</h4>\n<p>Fuktmodellen ble testet ved Aarhus Universitet, Danmark fra 2014 til 2015 og 2017 til 2018. I tillegg har vi testet modellen i DK, SE, LT, og FI i 2018 og 2019 (J\u00f8rgensen, L. N., Matzen, N., Ficke, A., Nielsen, G. C., Jalli, M., Ronis, A., ... &amp; Djurle, A. (2020). <em>Validation of risk models for control of leaf blotch diseases in wheat in the Nordic and Baltic countries</em>. European Journal of Plant Pathology, 157, 599-613.).</p>\n<h3>Referanser</h3>\n<p>Ficke, A., Grieu, C. &amp; Nordskog, B. 2020. Testing av ulike modeller for bladflekksjukdommer i hvete og bygg. Jord- og plantekultur 2020. NIBIO BOK 6 (1): 86-91.</p>\n<p>J\u00f8rgensen, L. N., Justesen, A. F., Heick, T. M., Matzen, N., &amp; Frederiksen, B. B. (2018). Testing different Septoria models in field trials. In Applied crop protection 2017 (pp. 77-88). DCA-Nationalt Center for F\u00f8devarer og Jordbrug.</p>\n<p>Kontaktperson: Andrea Ficke (andrea.ficke@nibio.no)</p>\n<h3>Lenker til mer informasjon</h3>\n<p><u><a href="https://www.plantevernleksikonet.no/l/oppslag/617/">Om hveteaksprikk i plantevernleksikonet</a></u></p>\n<p><u><a href="https://www.plantevernleksikonet.no/l/oppslag/319/">Om byggbrunflekk i plantevernleksikonet</a></u></p>\n<p><a href="https://www.plantevernleksikonet.no/l/oppslag/618/">Om hvetebladprikk i plantevernleksikonet</a></p>\n<p>\u00a0</p>
statusInterpretation=<p>N&aring;r antall timer med bladfuktighet i en mottakelig sort n&aelig;rmer seg 20, vil risikokurven g&aring;r over i et r&oslash;dt omr&aring;de og direkte bekjempingstiltak skal vurderes pga. &oslash;kt infeksjonsrisiko. Det vises ogs&aring; en prognose for de kommende dager.</p>
